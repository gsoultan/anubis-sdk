  RealmCategory category = 1;
}

message Application {
  string id = 1;
  string slug = 2;
  string name = 3;
  string kind = 4;  // spa | native | server | service
  string status = 5;
  repeated string redirect_uris = 6;
  string backchannel_logout_uri = 7;
  // Exact-match allowlist for RP-initiated logout. Separate from
  // redirect_uris: a login callback is not a place to land after signing out,
  // and an open redirect here is a phishing primitive.
  repeated string post_logout_redirect_uris = 12;
  string token_format = 8;
  string access_token_ttl = 9;
  string refresh_token_ttl = 10;
  int32 manifest_version = 11;
}

