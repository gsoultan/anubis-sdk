  int32 depth = 2;
}

message ScopeAncestorsResponse {
  repeated ScopeAncestor ancestors = 1;
}

message SearchGrantsRequest {
  string query = 1;        // username or role name substring
  string identity_id = 2;  // narrow to one person
  string role_id = 3;      // narrow to one role
  string source = 4;       // direct | membership | empty for both
  bool include_revoked = 5;
  int32 page_size = 6;     // default 50, max 200
  string page_token = 7;   // id of the last row on the previous page
}

message SearchGrantsResponse {
  repeated Grant grants = 1;
  // The username is carried on the row: resolving it per grant in the
  // console would be one lookup per line.
  repeated string usernames = 2;
  string next_page_token = 3;
}

message SetOperatorStatusRequest {
  string operator_id = 1;
  string status = 2;  // active | disabled
}

message SetOperatorStatusResponse {}

message ApiKey {
  string id = 1;
  string label = 2;
  // The public half, e.g. anb_live_abc123 — enough to recognise a key in a
  // config file without being able to use it.
  string prefix = 3;
  string created_by = 4;  // platform user's name; empty if since removed
  int64 created_at = 5;
  int64 last_used_at = 6;
  int64 expires_at = 7;
  int64 revoked_at = 8;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKey keys = 1;
}

message CreateApiKeyRequest {
  string label = 1;
  int64 expires_at = 2;  // unix seconds; 0 = no expiry
}

message CreateApiKeyResponse {
  // Full key, returned exactly once; only prefix + hash are stored.
  string api_key = 1;
  string prefix = 2;
  string id = 3;
}

