  string id = 1;
  string application_slug = 2;
  int32 priority = 3;
  string effect = 4;  // public | require_auth | require_permission | deny
  string path_pattern = 5;
  string host_pattern = 6;
  repeated string methods = 7;
  string permission_key = 8;
  string scope_bindings_json = 9;
}

message ListRoutePoliciesRequest {
