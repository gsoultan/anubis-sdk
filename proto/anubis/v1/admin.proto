  string id = 1;
  string realm_id = 2;
  string code = 3;
  string display_name = 4;
  int32 sort_order = 5;
  // Counted in the database. The console used to tally the rows it had
  // fetched, which a page cap made wrong on any real directory.
  int64 identity_count = 6;
}

message ListRealmCategoriesRequest {
  string realm_id = 1;
}

message ListRealmCategoriesResponse {
