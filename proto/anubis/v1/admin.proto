// ============================================================================
// Bulk provisioning: people and the access they hold, from a spreadsheet.
// Gated per sheet — a People-only workbook needs anubis:identity:write, and
// only a workbook carrying grants or memberships needs anubis:grant:admin.
// ============================================================================

service ProvisioningService {
  // DownloadImportTemplate hands out the workbook to fill in. Its columns
  // are generated from the same schema the importer parses, so a template
  // and the server that reads it back cannot drift apart.
  rpc DownloadImportTemplate(DownloadImportTemplateRequest) returns (DownloadImportTemplateResponse);
  // ImportWorkbook reads a filled-in workbook. Call it with dry set first:
  // nothing is written, and the report lists every problem in the file at
  // once. An import applies in full or not at all.
  rpc ImportWorkbook(ImportWorkbookRequest) returns (ImportWorkbookResponse);
}

message DownloadImportTemplateRequest {}

message DownloadImportTemplateResponse {
  bytes workbook = 1;
  string filename = 2;
  string content_type = 3;
}

message ImportWorkbookRequest {
  bytes workbook = 1;
  // dry asks what the import would do without changing anything.
  bool dry = 2;
}

// ImportIssue is one problem with one row, addressed the way the operator
// sees their own file. row is the spreadsheet row number; zero means the
// problem is with the sheet as a whole.
message ImportIssue {
  string sheet = 1;
  int32 row = 2;
  string column = 3;
  string message = 4;
}

message ImportWorkbookResponse {
  bool dry = 1;
  // applied is true only when the work was committed. A dry run and an
  // import refused over its issues both come back with counters filled in
  // and applied false.
  bool applied = 2;
  int32 people_created = 3;
  int32 people_existing = 4;
  int32 grants_created = 5;
  int32 grants_skipped = 6;
  // memberships_assigned counts people added. On a dry run it is an upper
  // bound: somebody who is already a member is only detected once the
  // assignment actually runs.
  int32 memberships_assigned = 7;
  int32 memberships_existing = 8;
  repeated ImportIssue issues = 9;
  // issues_omitted counts problems past the report's cap, so a truncated
  // report never reads as a clean one.
  int32 issues_omitted = 10;
}

// ============================================================================
// Platform user management (ADR-0011). The people who operate this
// installation — including the owner created by setup — and which tenants each
// of them may administer. Gated on anubis:platform:assign.
// ============================================================================

service PlatformAdminService {
  // ListOperators is everyone who can administer this installation, with the
  // assignments that say where.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);
  // Machine credentials for operators. A key acts AS its owner and carries
  // exactly their assignments, checked on every call — so it can never do
  // more than they can, and revoking their access revokes the key's too.
  // This is how a pipeline applies a manifest (0029 removed the old path).
  rpc CreatePlatformApiKey(CreatePlatformApiKeyRequest) returns (CreatePlatformApiKeyResponse);
  rpc ListPlatformApiKeys(ListPlatformApiKeysRequest) returns (ListPlatformApiKeysResponse);
  rpc RevokePlatformApiKey(RevokePlatformApiKeyRequest) returns (RevokePlatformApiKeyResponse);
  // CreateOperator adds a platform administrator: an account in the platform
  // tenant, which is a separate population from any tenant's own people.
  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse);
  // AssignOperator gives an operator authority over one tenant, or over every
  // tenant when tenant_slug is empty.
  rpc AssignOperator(AssignOperatorRequest) returns (AssignOperatorResponse);
  rpc RevokeAssignment(RevokeAssignmentRequest) returns (RevokeAssignmentResponse);
  // SetOperatorStatus disables or restores a platform user. Disabling takes
  // effect on their live tokens, not when those tokens expire.
  rpc SetOperatorStatus(SetOperatorStatusRequest) returns (SetOperatorStatusResponse);
}

// OperatorAssignment is one operator's authority over one tenant. An empty
// tenant_slug means every tenant: the installation owner.
message OperatorAssignment {
  string id = 1;
  string tenant_slug = 2;
  string role = 3;      // support | admin | owner
  string reason = 4;
  int64 valid_until = 5;
  int64 created_at = 6;
}

message Operator {
  string identity_id = 1;
  string username = 2;
  string email = 3;
  string status = 4;
  int64 created_at = 5;
  int64 last_login_at = 6;
  repeated OperatorAssignment assignments = 7;
  // owner is true when this operator holds authority over every tenant. The
  // console uses it to stop the last owner being stripped of it.
  bool owner = 8;
  // Whether this operator has a second factor. An owner needs to see who
  // does not.
  bool mfa_enrolled = 9;
}

message PlatformApiKey {
  string id = 1;
  string platform_user_id = 2;
  string username = 3;
  string label = 4;
  // The public half: identifies the key without being usable alone.
  string lookup = 5;
  int64 created_at = 6;
  int64 last_used_at = 7;
  int64 expires_at = 8;
  int64 revoked_at = 9;
}

message CreatePlatformApiKeyRequest {
  // Empty means the caller themselves.
  string owner_id = 1;
  string label = 2;
  // Bounded by the server at 90 days. A credential that administers the
  // installation must not outlive the reason it was made.
  int32 expires_in_days = 3;
}

message CreatePlatformApiKeyResponse {
  PlatformApiKey key = 1;
  // Shown ONCE. It is stored only as a hash and cannot be recovered.
  string api_key = 2;
}

message ListPlatformApiKeysRequest {}

message ListPlatformApiKeysResponse {
  repeated PlatformApiKey keys = 1;
}

message RevokePlatformApiKeyRequest {
  string id = 1;
}

message RevokePlatformApiKeyResponse {}

message ListOperatorsRequest {
  string query = 1;      // username substring
  int32 page_size = 2;   // default 50, max 200
  string page_token = 3; // last username of the previous page
}

message ListOperatorsResponse {
  repeated Operator operators = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
  // total is the whole population, so a screen can say "50 of 4,812" rather
  // than implying the page is everything there is.
  int32 total = 3;
}

message AssignOperatorRequest {
  // Either identifies the operator. A username is what somebody doing the
  // assigning has to hand; the page that lists operators has the id.
  string operator_id = 1;
  string tenant_slug = 2;  // empty = every tenant
  string role = 3;
  string reason = 4;
  int64 valid_until = 5;
  string operator_username = 6;
}

message AssignOperatorResponse {
  string assignment_id = 1;
}

message RevokeAssignmentRequest {
  string assignment_id = 1;
}

message RevokeAssignmentResponse {}

// CreateOperatorRequest adds a person who administers the PLATFORM. They are
// created in the platform tenant, which is a different population from a
// tenant's own people — a tenant's users never appear here and vice versa.
message CreateOperatorRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  // The authority they start with. Required: a platform user with no
  // assignment can sign in and administer nothing, which is never what
  // anybody meant to create.
  string tenant_slug = 4;  // empty = every tenant
  string role = 5;         // support | admin | owner
  string reason = 6;
}

message CreateOperatorResponse {
  string operator_id = 1;
  string assignment_id = 2;
}

// ============================================================================
// Platform sign-in (ADR-0011). A DIFFERENT door from tenant sign-in: a
// tenant's people authenticate through their realm against identities, and
// may be sent to a page built for them; an operator authenticates here
// against platform_users, with no tenant involved. Neither can use the
// other's door.
// ============================================================================

service PlatformAuthService {
  rpc PlatformLogin(PlatformLoginRequest) returns (PlatformLoginResponse);
  // PlatformVerifyMfa completes a challenge. A password alone is not a
  // session for an operator who has enrolled a second factor.
  rpc PlatformVerifyMfa(PlatformVerifyMfaRequest) returns (PlatformVerifyMfaResponse);
  // PlatformRefresh rotates a session: the presented refresh token is
  // consumed and a successor returned. Presenting a consumed token revokes
  // the whole family — theft detection, same as the identity side.
  rpc PlatformRefresh(PlatformRefreshRequest) returns (PlatformRefreshResponse);
  // PlatformLogout ends the session the refresh token belongs to.
  rpc PlatformLogout(PlatformLogoutRequest) returns (PlatformLogoutResponse);
  // BeginTotpEnrolment issues a secret. Nothing is demanded until confirmed.
  rpc BeginTotpEnrolment(BeginTotpEnrolmentRequest) returns (BeginTotpEnrolmentResponse);
  rpc ConfirmTotpEnrolment(ConfirmTotpEnrolmentRequest) returns (ConfirmTotpEnrolmentResponse);
  // MyTenants is which tenants this operator may administer.
  rpc MyTenants(MyTenantsRequest) returns (MyTenantsResponse);
}

message PlatformLoginRequest {
  // No tenant. Platform usernames are globally unique because an operator
  // belongs to none.
  string username = 1;
  string password = 2;
}

message PlatformLoginResponse {
  string access_token = 1;
  int32 expires_in = 2;
  string username = 3;
  bool owner = 4;
  // Set when a second factor is required; access_token is empty then.
  string mfa_token = 5;
  // Single-use; rotate via PlatformRefresh. The family's lifetime is
  // absolute from sign-in — rotation never extends it.
  string refresh_token = 6;
}

message PlatformRefreshRequest {
  string refresh_token = 1;
}

message PlatformRefreshResponse {
  string access_token = 1;
  int32 expires_in = 2;
  string refresh_token = 3;
  string username = 4;
  bool owner = 5;
}

message PlatformLogoutRequest {
  string refresh_token = 1;
}

message PlatformLogoutResponse {}

message PlatformVerifyMfaRequest {
  string mfa_token = 1;
  string code = 2;
}

message PlatformVerifyMfaResponse {
  string access_token = 1;
  int32 expires_in = 2;
  string username = 3;
  bool owner = 4;
  string refresh_token = 5;
}

message BeginTotpEnrolmentRequest {}

message BeginTotpEnrolmentResponse {
  // The shared secret, base32, for operators who cannot scan a code.
  string secret = 1;
  // otpauth:// URI for an authenticator app.
  string uri = 2;
}

message ConfirmTotpEnrolmentRequest {
  string code = 1;
}

message ConfirmTotpEnrolmentResponse {}

// MyTenantsRequest asks which tenants this operator may administer. The
// console picks the first by default and offers the rest in the header.
message MyTenantsRequest {}

message MyTenant {
  string slug = 1;
  string name = 2;
  string role = 3;
  // all is true for an installation owner, who may enter any tenant.
  bool all = 4;
}

message MyTenantsResponse {
  repeated MyTenant tenants = 1;
}

message UpdateTenantRequest {
  string id = 1;
  string name = 2;
}

message UpdateTenantResponse {}

message SetTenantStatusRequest {
  string id = 1;
  string status = 2;  // active | suspended | archived
}

message SetTenantStatusResponse {}

message GetTenantStatsRequest {
  string id = 1;
}

message GetTenantStatsResponse {
  int32 identities = 1;
  int32 grants = 2;
  int32 scope_nodes = 3;
  int32 memberships = 4;
}

message GetDashboardRequest {}

message RealmIdentityCount {
  string realm = 1;
  string kind = 2;
  int64 count = 3;
}

// One thing on the overview that deserves a human before any number.
message DashboardSignal {
  string kind = 1;      // refresh_token_reuse | key_rotation_due | retention_overdue
  string severity = 2;  // page | alert
  int64 count = 3;
  string detail = 4;
  int64 since = 5;      // unix seconds
}

message GetDashboardResponse {
  repeated RealmIdentityCount identities_by_realm = 1;
  int64 grants_total = 2;
  int64 scope_nodes_total = 3;
  // Decision counts come from the audit log, which SAMPLES authorize
  // events under pressure: floors, not exact figures.
  int64 decisions_24h = 4;
  int64 denies_24h = 5;
  repeated DashboardSignal signals = 6;
}

message GetScopeNodeRequest {
  string id = 1;
}

message GetScopeNodesRequest {
  repeated string ids = 1;  // at most 500
}

message GetScopeNodesResponse {
  repeated ScopeNode nodes = 1;
}

message GetScopeNodeResponse {
  ScopeNode node = 1;
}

