syntax = "proto3";

package anubis.v1;

option go_package = "github.com/gsoultan/anubis/gen/go/anubis/v1;anubisv1";

// ErrorInfo travels as a connect error detail. `code` is the stable
// machine-readable string from docs/api.md's envelope; the HTTP surface
// renders the same code in its JSON envelope, so clients see identical
// vocabulary on both transports.
message ErrorInfo {
  string code = 1;
  string request_id = 2;
  map<string, string> details = 3;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;   // always "Bearer"
  int32 expires_in = 4;    // access token lifetime, seconds
  string session_id = 5;
}
