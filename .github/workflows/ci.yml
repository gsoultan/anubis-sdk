name: ci

# One language, two Go modules. The toolchain is pinned from go.mod, so the
# "SKIP" branch that scripts/ci/local.sh has for a developer machine cannot
# happen here — in CI a missing toolchain is a failed job, not a quiet pass.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this before it tags anything, so a release cannot ship a
  # commit the suite has not agreed on.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            anubiskit/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . anubiskit)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # The root module must stay dependency-free. That is the SDK's central
      # promise — a service that only verifies tokens should not inherit a
      # dependency tree — and it is the kind of thing that erodes by accident.
      - name: root module has no dependencies
        run: |
          if grep -qE '^\s*require' go.mod; then
            echo "::error::go.mod grew a require block; the offline half must stay stdlib-only"
            cat go.mod; exit 1
          fi

      - name: vet
        run: go vet ./... && (cd anubiskit && go vet ./...)

      # -race because single-flight token rotation is the one behaviour here
      # that a serial test cannot prove.
      - name: test
        run: go test -race -count=1 ./... && (cd anubiskit && go test -race -count=1 ./...)
