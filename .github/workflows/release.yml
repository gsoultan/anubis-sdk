name: release

# A tag is the release. Go needs nothing beyond it — the module proxy reads
# tags directly — and neither does PHP, whose Packagist mirror is pushed by
# scripts/release/php-split.sh. Neither language carries a version in a
# manifest, so there is nothing here to keep in step with the tag and no
# registry credential to hold.
#
# What a tag alone does not do is run the suites at the commit being released,
# or write down what changed. That is this workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Releasing a commit the suites have not agreed on is the failure this
  # guards against. Both languages, run from the tag.
  verify:
    uses: ./.github/workflows/ci.yml

  github-release:
    name: github release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/         { exit }
            on                     { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME}"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
